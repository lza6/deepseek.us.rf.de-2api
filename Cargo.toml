[package]
name = "deepseek-es-2api"
version = "0.4.0"
edition = "2021"
description = "deepseek.es 免费 AI 服务 → OpenAI/Anthropic 兼容 API 网关（Rust 版，Cloudflare Turnstile 求解）"
authors = ["lza6"]
license = "MIT"
rust-version = "1.89"

[[bin]]
name = "deepseek-es-2api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "socks", "cookies"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
bytes = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
